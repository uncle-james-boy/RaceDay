name: RaceDay CI Build and Validate

on:
  push:
    branches: [main, part2]
  pull_request:
    branches: [main, part2]

jobs:
  part1-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ERD renderer dependency
        run: python -m pip install Pillow

      - name: Validate Part 1 documents and schema
        run: python tools/validate_part1.py

      - name: Set up Node.js for the DBML CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate DBML and compile SQL Server schema
        run: npx --yes -p @dbml/cli dbml2sql schema.dbml --mssql -o /tmp/raceday-dbml-check.sql

      - name: Lint Markdown
        uses: avto-dev/markdown-lint@v1
        with:
          config: '.markdownlint.json'
          args: 'README.md docs/API_Endpoint_Plan.md docs/Part2_Implementation_Blueprint.md docs/Part2_Rubric_Checklist.md docs/Video_Presentation_Guide.md docs/Part2_Video_Presentation_Guide.md'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution packages
        run: dotnet restore RaceDay.sln

      - name: Build API and tests
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test RaceDay.sln --no-build --no-restore --configuration Release
